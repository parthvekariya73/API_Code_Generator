# ─────────────────────────────────────────────
# application-prod.yml  —  Production
# Optimized for AWS Lambda (Standalone Mode)
# ─────────────────────────────────────────────

spring:
  # Base application name
  application:
    name: apiCodeGenerator

  # Async Task Executor (tuned for production)
  task:
    execution:
      pool:
        core-size: 8
        max-size: 50
        queue-capacity: 500
        keep-alive: 60s
      thread-name-prefix: "gen-prod-"

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  # Graceful shutdown is important for Lambda container lifecycle
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.apiCodeGenerator: INFO
    org.springframework: WARN
  # In Lambda, logs should go to console (CloudWatch), not files
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-time: ${JWT_EXPIRATION:3600000}