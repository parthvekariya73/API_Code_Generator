spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: apiCodeGenerator

  # Async Task Executor
  task:
    execution:
      pool:
        core-size: 8
        max-size: 50
        queue-capacity: 500
        keep-alive: 60s
      thread-name-prefix: "appt-opt-"
    scheduling:
      pool:
        size: 10
      thread-name-prefix: "scheduler-"

server:
  port: 9090
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html
    min-response-size: 2048
  tomcat:
    threads:
      max: 200                    # ⭐ For concurrent appointment requests
      min-spare: 25
    accept-count: 100
    max-connections: 10000
    connection-timeout: 20000
    uri-encoding: UTF-8
    mbeanregistry:
      enabled: true               # Monitoring
  error:
    include-message: never        # Override per profile
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus  # Added prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: apiCodeGenerator
  info:
    env:
      enabled: true

logging:
  level:
    root: INFO
    com.apiCodeGenerator: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB


